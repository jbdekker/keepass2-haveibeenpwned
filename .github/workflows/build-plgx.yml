name: Build PLGX

on:
  push:
    branches:
      - main

    tags:
      - '*'
permissions:
  contents: read

jobs:
  build:
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    runs-on: windows-2022
    env:
      KEEPASS_VERSION: ${{ vars.KEEPASS_VERSION || '2.62' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $branches = git branch --remote --contains $env:GITHUB_SHA | ForEach-Object { $_.Trim().TrimStart('*').Trim() }
          if ($branches -notcontains 'origin/main') {
            throw "Tag $env:GITHUB_REF_NAME does not point to a commit on origin/main."
          }
          "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT

      - uses: NuGet/setup-nuget@v4.0

      - uses: microsoft/setup-msbuild@v3

      - name: Install configured KeePass version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $archive = Join-Path $env:RUNNER_TEMP "KeePass-${env:KEEPASS_VERSION}.zip"
            $extractPath = Join-Path $env:RUNNER_TEMP "KeePass-${env:KEEPASS_VERSION}"
            $downloadUrl = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/${env:KEEPASS_VERSION}/KeePass-${env:KEEPASS_VERSION}.zip"

            Write-Host "Downloading KeePass $env:KEEPASS_VERSION"
            & curl.exe --fail --location --retry 3 --silent --show-error --output $archive $downloadUrl
            if ($LASTEXITCODE -ne 0) {
              throw "KeePass download failed with exit code $LASTEXITCODE."
            }
            Expand-Archive -Path $archive -DestinationPath $extractPath -Force

            $keePassExe = Join-Path $extractPath 'KeePass.exe'
            if (-not (Test-Path $keePassExe -PathType Leaf)) {
              throw "KeePass.exe was not found in the KeePass $env:KEEPASS_VERSION archive."
            }

            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $installPath = Join-Path $programFilesX86 'KeePass Password Safe 2'
            New-Item -ItemType Directory -Force -Path $installPath | Out-Null
            Copy-Item $keePassExe (Join-Path $installPath 'KeePass.exe') -Force
          }
          catch {
            Write-Host ($_ | Format-List * -Force | Out-String)
            Write-Host $_.ScriptStackTrace
            throw
          }

      - name: Test PLGX project paths
        run: python -m unittest discover -s tests -v

      - name: Restore NuGet packages
        run: nuget restore HaveIBeenPwned.sln

      - name: Build PLGX
        shell: pwsh
        run: |
          msbuild HaveIBeenPwned.sln /target:Clean /m
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild clean failed with exit code $LASTEXITCODE."
          }
          msbuild HaveIBeenPwned.sln /p:Configuration=ReleasePlgx /m
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild ReleasePlgx failed with exit code $LASTEXITCODE."
          }
          Copy-Item HaveIBeenPwned\bin\ReleasePlgx\HaveIBeenPwned.plgx .\HaveIBeenPwned.plgx

      - uses: actions/upload-artifact@v7
        with:
          name: HaveIBeenPwned-plgx
          path: HaveIBeenPwned.plgx
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HaveIBeenPwned-plgx
          path: dist

      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: dist/HaveIBeenPwned.plgx
          generate_release_notes: true
